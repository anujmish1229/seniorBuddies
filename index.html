<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Senior Buddies | Bridging Generations in Durham Region</title>
    <meta name="description" content="Senior Buddies is a youth-led group in Durham Region, Ontario, that brings youth volunteers and seniors together to reduce loneliness on both sides." />
    <meta name="author" content="Senior Buddies" />
    <meta name="theme-color" content="#1c2830" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;1,400&family=Fraunces:opsz,wght,SOFT@9..144,500..800,100&display=swap" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Senior Buddies | Bridging Generations in Durham Region" />
    <meta property="og:description" content="Connecting seniors with youth volunteers in Durham Region to reduce loneliness on both sides." />
    <meta property="og:site_name" content="Senior Buddies" />
    <meta property="og:image" content="https://seniorbuddiesdurham.ca/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bridging the intergenerational gap: Tanishka Sharma and Cecil Uncle smiling beside the Senior Buddies wordmark." />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Senior Buddies | Bridging Generations in Durham Region" />
    <meta name="twitter:description" content="Connecting seniors with youth volunteers in Durham Region to reduce loneliness on both sides." />
    <meta name="twitter:image" content="https://seniorbuddiesdurham.ca/og-image.jpg" />
    <meta name="twitter:image:alt" content="Bridging the intergenerational gap: Tanishka Sharma and Cecil Uncle smiling beside the Senior Buddies wordmark." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://seniorbuddiesdurham.ca/" />
    <meta property="og:url" content="https://seniorbuddiesdurham.ca/" />
  </head>
  <body>
    <!-- Hidden forms for Netlify Forms detection at build time -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <form name="join-volunteer" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="hidden" name="type" value="volunteer" />
    </form>
    <form name="senior-interest" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <textarea name="message"></textarea>
      <input type="hidden" name="type" value="senior" />
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
